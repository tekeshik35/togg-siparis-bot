name: Konfigüratör inceleme (tek seferlik)

on:
  push:
    branches: [main]
    paths: ["inspect/inspect.py", "inspect/run.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - run: python inspect/inspect.py
        continue-on-error: true
      - name: Sonuçları kaydet
        run: |
          git config user.name "togg-bot"
          git config user.email "togg-bot@users.noreply.github.com"
          git add inspect/out
          git commit -m "Konfigüratör inceleme çıktısı" || echo "değişiklik yok"
          git push
