name: Togg sipariş kontrolü

on:
  schedule:
    # Asıl tetikleme cron-job.org'dan geliyor (10 dakikada bir workflow_dispatch).
    # GitHub'ın kendi zamanlaması güvenilmez; sadece yedek olarak duruyor.
    - cron: "7-59/30 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Deneme mesajı gönderilsin mi?"
        type: boolean
        default: false
      report_now:
        description: "Günlük raporu şimdi gönder (deneme için)"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: togg-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Togg sayfalarını kontrol et
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_message && '1' || '0' }}
          REPORT_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.report_now && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check.py
